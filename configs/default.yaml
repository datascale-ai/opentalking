log_level: INFO
api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
infrastructure:
  redis_url: redis://localhost:6379/0
  avatars_dir: ./examples/avatars
  models_dir: ./models
  worker_url: http://127.0.0.1:9001
flashtalk:
  mode: off
  ws_url: ws://localhost:8765
  ckpt_dir: ./models/SoulX-FlashTalk-14B
  wav2vec_dir: ./models/chinese-wav2vec2-base
  port: 8765
  device: auto
  gpu_count: 8
  jpeg_quality: 40
llm:
  base_url: ""
  api_key: ""
  model: qwen-turbo
  system_prompt: You are a friendly digital human assistant.
tts:
  provider: xtts
  voice: zh-CN-XiaoxiaoNeural
  language: zh-cn
  sample_rate: 16000
  streaming_decode: true
  clone_reference_audio: ./voice/my_voice_24k.wav
  clone_model_name: ./models/XTTS-v2
  clone_device: auto
  clone_cache_dir: ./temp/tts_cache
  cosyvoice_model_dir: ./models/cosyvoice2
  cosyvoice_repo_dir: ./third_party/CosyVoice
  cosyvoice_mode: zero_shot
  cosyvoice_prompt_source: asr
  cosyvoice_prompt_prefix: ""
  cosyvoice_prompt_text: 大家好，这是一段用于声音建模和声音复刻测试的语音，现在我会用比较自然的语速来朗读，同时尽量保持发音清晰，节奏稳定。
  cosyvoice_prompt_max_seconds: 14.0
  cosyvoice_speed: 1.0
  asr_model_path: ./models/Whisper-large-v3/large-v3.pt
  asr_language: zh
model:
  torch_device: cpu
  default_model: wav2lip
